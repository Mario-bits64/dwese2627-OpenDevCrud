spring.application.name=dwese2627-OpenDevCrud-webapp-mariojurado
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# Cargar las variables del archivo .env
spring.config.import=optional:file:.env[.properties]

# Inicialización de la base de datos (las tablas las crean schema.sql y data.sql, no Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Mensajes de internacionalización
spring.messages.encoding=UTF-8
spring.messages.basename=messages

# Consultas SQL generadas por Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
