<!-- fragments/pagination.html -->
<div th:fragment="pagination(baseUrl)" xmlns:th="http://www.thymeleaf.org"
     class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 mt-3"
     th:if="${totalPages != null and totalPages > 0}">
    <!-- Info de página: "Página X de Y (N registros en total)" -->
    <div>
        <span th:text="#{msg.pagination.info(${currentPage} + 1, ${totalPages}, ${totalElements})}"></span>
    </div>
    <!-- Controles de paginación -->
    <nav th:aria-label="#{msg.pagination.aria.label}">
        <ul class="pagination mb-0">
            <!-- Botón Anterior -->
            <li class="page-item" th:classappend="${currentPage == 0} ? ' disabled'">
                <a class="page-link"
                   th:href="@{${baseUrl}(page=${currentPage - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                   th:aria-label="#{msg.pagination.prev}">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <!-- Números de página -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i} == ${currentPage} ? ' active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{${baseUrl}(page=${i}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"></a>
            </li>
            <!-- Botón Siguiente -->
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? ' disabled'">
                <a class="page-link"
                   th:href="@{${baseUrl}(page=${currentPage + 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                   th:aria-label="#{msg.pagination.next}">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>
